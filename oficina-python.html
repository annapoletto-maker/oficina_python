<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oficina Python</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=JetBrains+Mono:wght@500&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#e6eef6;--card:#fff;--ink:#15233b;--mute:#58698a;--py:#306998;--yl:#ffd43b;--edbg:#102038;--edtx:#e8f1ff;--err:#c23b3b;--ok:#1f8a4c;--line:#15233b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1523;--card:#16233a;--ink:#e8f0fb;--mute:#9db1cc;--edbg:#0a1220;--err:#ff8c8c;--ok:#6fdc9a;--line:#e8f0fb;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1523;--card:#16233a;--ink:#e8f0fb;--mute:#9db1cc;--edbg:#0a1220;--err:#ff8c8c;--ok:#6fdc9a;--line:#e8f0fb;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:620px;margin:0 auto;padding:16px 16px 48px}
h1{font:800 1.9rem/1.1 "Bricolage Grotesque",sans-serif;margin:0 0 4px}
h1 span{background:var(--yl);color:#15233b;padding:0 .15em;border-radius:3px}
h2{font:800 1.35rem/1.2 "Bricolage Grotesque",sans-serif;margin:16px 0 6px}
.sc{color:var(--mute);margin:0 0 12px}
.nav{display:flex;flex-wrap:wrap;gap:6px}
.nav button{width:40px;height:40px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 .95rem "Bricolage Grotesque",sans-serif;cursor:pointer}
.nav button.on{background:var(--py);color:#fff}
.nav button.dn{background:var(--yl);color:#15233b}
.nav button:disabled{opacity:.35;cursor:default}
